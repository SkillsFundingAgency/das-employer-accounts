# Employer Accounts Web UI – complete isolation stack (APPMAN-1150)
# Usage: docker compose up --build
# Prerequisites: private NuGet feed credentials for SFA.DAS.* (see README).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Isolation_P@ssw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - isolation-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Isolation_P@ssw0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Isolation_P@ssw0rd!"
    volumes:
      - ./tools/isolation/sql:/sql:ro
    entrypoint: ["/bin/bash", "/sql/entrypoint.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8080:8080"
    volumes:
      - ./tools/isolation/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]

volumes:
  isolation-sql:
