# Employer Accounts Web UI – complete isolation stack (APPMAN-1150)
# Usage: docker compose up --build
# Prerequisites: private NuGet feed credentials for SFA.DAS.* (see README).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Isolation_P@ssw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - isolation-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Isolation_P@ssw0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Isolation_P@ssw0rd!"
    volumes:
      - ./tools/isolation/sql:/sql:ro
    entrypoint: ["/bin/bash", "/sql/entrypoint.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8080:8080"
    volumes:
      - ./tools/isolation/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]

  web:
    build:
      context: .
      dockerfile: tools/isolation/Dockerfile.web
      args:
        # Pass at build time if restore fails against nuget.org alone:
        # NUGET_FEED_URL / NUGET_FEED_USER / NUGET_FEED_PASS
        NUGET_FEED_URL: ${NUGET_FEED_URL:-}
        NUGET_FEED_USER: ${NUGET_FEED_USER:-}
        NUGET_FEED_PASS: ${NUGET_FEED_PASS:-}
    depends_on:
      sql-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      wiremock:
        condition: service_started
    environment:
      IsolationMode: "true"
      ASPNETCORE_ENVIRONMENT: Development
      EnvironmentName: LOCAL
      ResourceEnvironmentName: LOCAL
      StubAuth: "true"
      StubEmail: isolation.employer@example.com
      StubId: "11111111-1111-1111-1111-111111111111"
      # Nested config overrides for container DNS names
      SFA.DAS.EmployerAccounts__DatabaseConnectionString: "Server=sqlserver,1433;Database=EmployerAccounts;User Id=sa;Password=Isolation_P@ssw0rd!;TrustServerCertificate=True;Encrypt=False"
      SFA.DAS.EmployerAccounts__DataProtectionKeysDatabase: "Server=sqlserver,1433;Database=EmployerAccounts;User Id=sa;Password=Isolation_P@ssw0rd!;TrustServerCertificate=True;Encrypt=False"
      SFA.DAS.EmployerAccounts__RedisConnectionString: "redis:6379"
      SFA.DAS.EmployerAccounts__EmployerAccountsOuterApiConfiguration__BaseUrl: "http://wiremock:8080/"
      SFA.DAS.EmployerAccounts__EmployerAccountsOuterApiConfiguration__Key: "isolation-fake-subscription-key"
      SFA.DAS.EmployerAccounts__ContentApi__ApiBaseUrl: "http://wiremock:8080/"
      SFA.DAS.EmployerAccounts__ContentApi__IdentifierUri: ""
      SFA.DAS.EmployerAccounts__AccountApi__ApiBaseUrl: "http://wiremock:8080/account-api/"
      SFA.DAS.EmployerAccounts__AccountApi__IdentifierUri: ""
    ports:
      - "5024:5024"

volumes:
  isolation-sql:
